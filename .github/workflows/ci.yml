name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Deterministic success example
        run: python -m runtime_lab.cli examples/read_only_success.json
      - name: Deterministic authority-denial example
        run: python -m runtime_lab.cli examples/authority_denial.json
      - name: Deterministic budget-exhaustion example
        run: python -m runtime_lab.cli examples/budget_exhaustion.json
      - name: Public-boundary check
        run: python scripts/check_public_boundary.py
